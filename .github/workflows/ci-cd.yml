
name: Inventory Management CI/CD

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download source code from GitHub
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: Install application and testing dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Step 4: Execute automated tests
      - name: Run automated tests
        run: python -m pytest -v

      # Step 5: Display success message
      - name: CI success message
        run: echo "Inventory Management CI Pipeline completed successfully"

